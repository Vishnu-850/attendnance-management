<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 50px; }
    .container { max-width: 400px; margin: 0 auto; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-buttons button { padding: 10px 20px; cursor: pointer; background: #ddd; border: none; }
    .tab-buttons button.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    input { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; }
    button[type="submit"] { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    .msg { margin-top: 15px; color: green; }
    .msg.error { color: red; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tab-buttons">
      <button class="tab-button active" onclick="showTab('login')">Login</button>
      <button class="tab-button" onclick="showTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login" class="tab-content active">
      <h2>Student Login</h2>
      <input type="email" id="loginEmail" placeholder="Email"><br>
      <input type="password" id="loginPassword" placeholder="Password"><br>
      <button type="submit" onclick="login()">Login</button>
      <p id="loginMsg" class="msg"></p>
    </div>

    <!-- Register Form -->
    <div id="register" class="tab-content">
      <h2>Register New Account</h2>
      <input type="text" id="regName" placeholder="Full Name"><br>
      <input type="email" id="regEmail" placeholder="Email"><br>
      <input type="password" id="regPassword" placeholder="Password"><br>
      <select id="regRole" style="width: 100%; padding: 8px; margin: 5px 0 15px 0;">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
      </select><br>
      <button type="submit" onclick="register()">Register</button>
      <p id="regMsg" class="msg"></p>
    </div>
  </div>

  <script>
  function showTab(tabName) {
    // Hide all tabs
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    
    // Show selected tab
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
  }

  async function register() {
    const name = document.getElementById("regName").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;
    const role = document.getElementById("regRole").value;

    if (!name || !email || !password) {
      document.getElementById("regMsg").innerText = "All fields are required";
      document.getElementById("regMsg").classList.add('error');
      return;
    }

    const res = await fetch("http://localhost:5000/api/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name, email, password, role })
    });

    const data = await res.json();
    console.log("Register Response:", res.status, data);

    if (res.ok) {
      document.getElementById("regMsg").innerText = "Registration successful! Please login.";
      document.getElementById("regMsg").classList.remove('error');
      document.getElementById("regName").value = "";
      document.getElementById("regEmail").value = "";
      document.getElementById("regPassword").value = "";
      setTimeout(() => showTab('login'), 2000);
    } else {
      document.getElementById("regMsg").innerText = data.message || "Registration failed";
      document.getElementById("regMsg").classList.add('error');
    }
  }

  async function login() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      document.getElementById("loginMsg").innerText = "Email and password are required";
      document.getElementById("loginMsg").classList.add('error');
      return;
    }

    const res = await fetch("http://localhost:5000/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    console.log("Login Response:", res.status, data);

    if (res.ok) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("role", data.user.role);

      if (data.user.role === "admin" || data.user.role === "teacher") {
        window.location.href = "admin-dashboard.html";
      } else {
        window.location.href = "dashboard.html";
      }
    } else {
      document.getElementById("loginMsg").innerText = data.message || "Login failed";
      document.getElementById("loginMsg").classList.add('error');
    }
  }
</script>
</body>
</html>
